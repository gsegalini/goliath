[project]
name = "goliath"
version = "1.0.0"
description = "GOLIATH: Gradient Inversion of Tabular Diffusion Models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.8",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "scikit-learn==1.6.1",
    "scipy==1.17.0",
    "seaborn==0.13.2",
    "syntheval==1.6.2",
    "torch==2.8.0",
    "tqdm==4.67.1",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
